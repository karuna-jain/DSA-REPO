<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Pattern Portfolio Dashboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PrismJS Dark Theme for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fas fa-terminal brand-icon"></i>
                    <span class="brand-title">DSA Portfolio</span>
                </div>
            </div>
            <div class="sidebar-menu" id="sidebar-menu">
                <!-- Populated dynamically via JS -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Top Navigation & Controls Bar -->
            <header class="top-bar">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" class="search-input" placeholder="Search by problem, pattern, approach, or code...">
                </div>

                <div class="stats-summary">
                    <div class="stat-pill" title="Total Solutions">
                        <i class="fas fa-check-circle stat-pill-icon"></i>
                        <span>Total: <strong id="stat-total-count">0</strong></span>
                    </div>
                    <div class="stat-pill" style="border-color: rgba(16, 185, 129, 0.2);" title="Easy Solutions">
                        <span style="color: var(--accent-emerald);">●</span>
                        <span>Easy: <strong id="stat-easy-count" style="color: var(--accent-emerald);">0</strong></span>
                    </div>
                    <div class="stat-pill" style="border-color: rgba(245, 158, 11, 0.2);" title="Medium Solutions">
                        <span style="color: #f59e0b;">●</span>
                        <span>Medium: <strong id="stat-medium-count" style="color: #f59e0b;">0</strong></span>
                    </div>
                    <div class="stat-pill" style="border-color: rgba(239, 68, 68, 0.2);" title="Hard Solutions">
                        <span style="color: #ef4444;">●</span>
                        <span>Hard: <strong id="stat-hard-count" style="color: #ef4444;">0</strong></span>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container (Home, Patterns, Search Results) -->
            <section class="view-container" id="view-container">
                <!-- Rendered dynamically -->
            </section>

            <!-- Solution Code Viewer Panel -->
            <section class="code-viewer-container" id="code-viewer-container">
                
                <!-- Left Details Box -->
                <div class="code-details-panel" id="code-details-content">
                    <!-- Populated dynamically -->
                </div>

                <!-- Right Code Editor Window -->
                <div class="code-editor-panel">
                    <div class="code-editor-header">
                        <div class="editor-file-info">
                            <i class="fab fa-java"></i>
                            <span id="editor-filename">Solution.java</span>
                        </div>
                        <div class="editor-actions">
                            <button id="editor-copy-btn" class="editor-btn" onclick="copyCode()">
                                <i class="far fa-copy"></i> Copy Code
                            </button>
                        </div>
                    </div>
                    <div class="code-pre-wrapper">
                        <pre><code id="editor-code" class="language-java"></code></pre>
                    </div>
                </div>

            </section>

        </main>

    </div>

    <!-- PrismJS Core and Java Syntax scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    
    <!-- JS Data and App Controller -->
    <script src="data.js"></script>
    <script src="app.js"></script>

</body>
</html>
